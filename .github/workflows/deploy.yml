name: YaroAppManagement Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: yaro-management-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy YaroAppManagement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Management Panel
        run: npm run build

      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: false
          script: |
            echo "========================================"
            echo "   YARO MANAGEMENT PRODUCTION DEPLOY"
            echo "========================================"
            echo "GitHub Commit: ${{ github.sha }}"
            echo "GitHub Branch: ${{ github.ref_name }}"
            echo "Deployment started: $(date)"

            # Ensure 2GB swap space exists
            if ! swapon --show | grep -q "/swapfile"; then
              echo "Creating 2GB swapfile..."
              fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile || true
            fi

            # Update Nginx client_max_body_size to 300M
            if [ -f /etc/nginx/nginx.conf ]; then
              if grep -q "client_max_body_size" /etc/nginx/nginx.conf; then
                sed -i 's/client_max_body_size .*/client_max_body_size 300M;/' /etc/nginx/nginx.conf
              else
                sed -i '/http {/a \    client_max_body_size 300M;' /etc/nginx/nginx.conf
              fi
            fi

            for conf in /etc/nginx/sites-available/* /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*; do
              if [ -f "$conf" ]; then
                if grep -q "client_max_body_size" "$conf"; then
                  sed -i 's/client_max_body_size .*/client_max_body_size 300M;/' "$conf"
                fi
              fi
            done

            # Locate app management directory
            APP_DIR=""
            for dir in /root/apps/app-management /root/apps/yaro-management /root/apps/Yaro/YaroAppManagement /var/www/yaro-management; do
              if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
                APP_DIR="$dir"
                break
              fi
            done

            echo "Target management directory: $APP_DIR"

            if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
              cd "$APP_DIR"
              echo "Pulling latest code in $APP_DIR..."
              git fetch origin main || true
              git reset --hard origin/main || true
              echo "Installing dependencies..."
              npm install --no-audit --no-fund || true
              echo "Building Next.js application with 2GB memory..."
              NODE_OPTIONS="--max-old-space-size=2048" npm run build || true
            fi

            echo "Restarting management PM2 process..."
            pm2 restart yaro-management --update-env 2>/dev/null || pm2 restart app-management --update-env 2>/dev/null || pm2 reload all --force || pm2 restart all || true
            pm2 save || true

            sleep 3
            PM2_MGT_STATUS=$(pm2 list)
            echo "$PM2_MGT_STATUS"

            LOCAL_MGT_CURL=$(curl -sv http://127.0.0.1:3102 2>&1 || curl -sv http://127.0.0.1:3000 2>&1 || true)
            echo "$LOCAL_MGT_CURL"

            nginx -t && (systemctl reload nginx || service nginx reload || true)

            echo "========================================"
            echo "       DEPLOYMENT COMPLETED"
            echo "========================================"
            echo "Deployment finished: $(date)"

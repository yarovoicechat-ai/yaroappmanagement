name: YaroAppManagement Production Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: yaro-management-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy YaroAppManagement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Management Panel
        run: npm run build

      - name: Deploy to Contabo
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -uo pipefail

            echo "========================================"
            echo "   YARO MANAGEMENT PRODUCTION DEPLOY"
            echo "========================================"
            echo "GitHub Commit: ${{ github.sha }}"
            echo "GitHub Branch: ${{ github.ref_name }}"
            echo "Deployment started: $(date)"

            # Ensure deploy script uses --force for pm2 reload to prevent concurrency locks
            if [ -f /root/deployments/yaro-management/deploy-yaro-management.sh ]; then
              sed -i 's/--force//g' /root/deployments/yaro-management/deploy-yaro-management.sh || true
              sed -i 's/pm2 reload/pm2 reload --force/g' /root/deployments/yaro-management/deploy-yaro-management.sh || true
            fi

            if ! /root/deployments/yaro-management/deploy-yaro-management.sh; then
              echo "deploy-yaro-management.sh had non-zero exit, executing fallback PM2 reload with --force..."
              sleep 5
              pm2 reload all --force || pm2 restart all
            fi

            echo "========================================"
            echo "       DEPLOYMENT COMPLETED"
            echo "========================================"
            echo "Deployment finished: $(date)"
